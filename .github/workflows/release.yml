name: Release Zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        run: |
          mkdir -p build/GearWeights
          find . -mindepth 1 -maxdepth 1 \
            ! -name build ! -name .git ! -name .github \
            -exec cp -r {} build/GearWeights/ \;
          cd build && zip -r "../GearWeights-${{ steps.version.outputs.version }}.zip" GearWeights

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GearWeights ${{ steps.version.outputs.version }}
          files: GearWeights-${{ steps.version.outputs.version }}.zip
